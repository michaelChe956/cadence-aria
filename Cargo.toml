[package]
name = "cadence-aria"
version = "0.1.1"
edition = "2024"

[features]
# —— D5 / D6 独立切分开关（测量「哪一项改动贡献了什么」）——
# 默认全开 ⇒ 默认构建行为与全量实现**逐字节一致**；关闭某项即等价于
# 「只回退该项」。仅用于 A/B 测量，**不是**产品开关（env 层归属
# `explicit-sc-author-effort`，本 change 不夹带运行时开关面）。
default = ["wig-d5-before", "wig-d5-after", "wig-d6"]
wig-d5-before = []      # D5 事前：基线树清单直供（L1 扩展）
wig-d5-after = []       # D5 事后：越界报错回灌基线树最近候选路径
wig-d6 = []             # D6：前轮 findings 内容身份求交 + 去重 + 分区注入

[lib]
name = "cadence_aria"
path = "src/lib.rs"

[[bin]]
name = "aria"
path = "src/main.rs"

[dependencies]
anyhow = "1.0.102"
async-trait = "0.1"
base64 = "0.22"
axum = { version = "0.8", features = ["ws", "multipart"] }
chrono = { version = "0.4.44", features = ["clock", "serde"] }
command-group = { version = "5.0", features = ["with-tokio"] }
futures-util = "0.3"
hex = "0.4.3"
image = { version = "0.25", default-features = false, features = ["png", "jpeg", "webp"] }
libc = "0.2.177"
mime_guess = "2.0"
pulldown-cmark = "0.13.3"
png = "0.17"
reqwest = { version = "0.12", default-features = false, features = ["json", "multipart", "rustls-tls"] }
rust-embed = { version = "8", features = ["debug-embed"] }
serde = { version = "1.0.228", features = ["derive"] }
serde_json = "1.0.149"
serde_yaml = "0.9.34"
sha2 = "0.10.9"
thiserror = "2.0.18"
tokio = { version = "1.52.1", features = ["fs", "io-util", "macros", "net", "process", "rt-multi-thread", "sync", "time"] }
tokio-stream = { version = "0.1", features = ["sync"] }
tokio-util = "0.7"
tower = { version = "0.5", features = ["util"] }
tower-http = { version = "0.6", features = ["fs", "trace"] }
tracing = "0.1"
# 生产 tracing subscriber（`aria web` 日志落盘：stderr + `<状态根>/logs/aria.log`）。
# owner 2026-11-13 裁决：从 [dev-dependencies] 移到运行时依赖（「客户机可诊断性」
# 所需的有意变更）；版本与 features 不变 ⇒ Cargo.lock 零变化。
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
uuid = { version = "1.23.1", features = ["v4", "v5", "serde"] }
unicode-normalization = "0.1.25"

[dev-dependencies]
mockito = "1"
parking_lot = "0.12"
tempfile = "3.27.0"
tokio-tungstenite = "0.29"

# 开发/测试构建：用更轻的调试信息以控制 target 体积
[profile.dev]
debug = "line-tables-only"

# 依赖项不带本地调试信息，并带轻度优化（依赖代码不调试，无需 debuginfo）
[profile.dev.package."*"]
debug = false
opt-level = 1

# Release 构建：嵌入前端 + git 重依赖后控制二进制体积（npx 分发友好）
[profile.release]
strip = true
lto = true
opt-level = "s"
codegen-units = 1

# CI 门禁专用：poll 帧门禁要用 `nm`/`objdump` 读**测试二进制**的符号表，
# 而 `[profile.release] strip = true` 会把符号表剥掉 ⇒ 门禁在 release 下
# 必然 fail-closed（CI 实证：Release profile gates job 因 [missing-symbol] 失败）。
# ⇒ 只给**门禁那次构建**开一个保留符号的 profile；发布件仍走 [profile.release]，
#    **产物字节数与发布体积门禁完全不受影响**。
[profile.release-ci-gate]
inherits = "release"
strip = false
debug = 1
