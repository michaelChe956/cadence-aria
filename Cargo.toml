[package]
name = "cadence-aria"
version = "0.1.1"
edition = "2024"

[features]
# `sc-author-baseline-tree`：D5 事前（plan 基线树清单直供）的**编译期**开关。
#
# ⚠️ 仅用于「D5 事前去留」的 A/B 判决实验：关闭它即等价于「只保留 D5 事后 +
# D6」，用于同装置同时段对照。判决完成后，本 feature 及其分支**一并移除**
# （或按判决结果把实现定案为默认开 / 整体撤除）。
#
# 采用**编译期**而非运行时 env 旋钮：避免给产品新增运行时开关面（env 层归属
# `explicit-sc-author-effort`，本 change 不夹带）。
default = ["sc-author-baseline-tree"]
sc-author-baseline-tree = []

[lib]
name = "cadence_aria"
path = "src/lib.rs"

[[bin]]
name = "aria"
path = "src/main.rs"

[dependencies]
anyhow = "1.0.102"
async-trait = "0.1"
base64 = "0.22"
axum = { version = "0.8", features = ["ws", "multipart"] }
chrono = { version = "0.4.44", features = ["clock", "serde"] }
codex-app-server-protocol = { git = "https://github.com/openai/codex.git", package = "codex-app-server-protocol", tag = "rust-v0.124.0" }
codex-protocol = { git = "https://github.com/openai/codex.git", package = "codex-protocol", tag = "rust-v0.124.0" }
command-group = { version = "5.0", features = ["with-tokio"] }
futures-util = "0.3"
hex = "0.4.3"
image = { version = "0.25", default-features = false, features = ["png", "jpeg", "webp"] }
libc = "0.2.177"
mime_guess = "2.0"
pulldown-cmark = "0.13.3"
png = "0.17"
reqwest = { version = "0.12", default-features = false, features = ["json", "multipart", "rustls-tls"] }
rust-embed = { version = "8", features = ["debug-embed"] }
serde = { version = "1.0.228", features = ["derive"] }
serde_json = "1.0.149"
serde_yaml = "0.9.34"
sha2 = "0.10.9"
thiserror = "2.0.18"
tokio = { version = "1.52.1", features = ["fs", "io-util", "macros", "net", "process", "rt-multi-thread", "sync", "time"] }
tokio-stream = { version = "0.1", features = ["sync"] }
tokio-util = "0.7"
tower = { version = "0.5", features = ["util"] }
tower-http = { version = "0.6", features = ["fs", "trace"] }
tracing = "0.1"
uuid = { version = "1.23.1", features = ["v4", "v5", "serde"] }
unicode-normalization = "0.1.25"

[dev-dependencies]
mockito = "1"
parking_lot = "0.12"
tempfile = "3.27.0"
tokio-tungstenite = "0.29"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }

# 开发/测试构建：用更轻的调试信息以控制 target 体积
[profile.dev]
debug = "line-tables-only"

# 依赖项不带本地调试信息，并带轻度优化（依赖代码不调试，无需 debuginfo）
[profile.dev.package."*"]
debug = false
opt-level = 1

# Release 构建：嵌入前端 + git 重依赖后控制二进制体积（npx 分发友好）
[profile.release]
strip = true
lto = true
opt-level = "s"
codegen-units = 1

# CI 门禁专用：poll 帧门禁要用 `nm`/`objdump` 读**测试二进制**的符号表，
# 而 `[profile.release] strip = true` 会把符号表剥掉 ⇒ 门禁在 release 下
# 必然 fail-closed（CI 实证：Release profile gates job 因 [missing-symbol] 失败）。
# ⇒ 只给**门禁那次构建**开一个保留符号的 profile；发布件仍走 [profile.release]，
#    **产物字节数与发布体积门禁完全不受影响**。
[profile.release-ci-gate]
inherits = "release"
strip = false
debug = 1
