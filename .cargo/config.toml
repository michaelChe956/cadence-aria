[build]
# 本仓库编译图为串行瓶颈型（lib 先编完，6 个测试二进制才能并行），
# 有效并行宽度约 5–8；钉 8 既不更慢又控制内存峰值（实测峰值 ~3GB），避免 swap 抖动。
# 命令行无需再写 -j；严禁用 -j 1（会退化为单核串行，测试从 ~1.5min 涨到 6min）。
jobs = 8

[env]
# debug 测试线程栈：libtest 以 RUST_MIN_STACK 作为测试线程默认栈大小。tests/it_web 的
# provider_matrix 用例（三 provider 串跑完整 plan repair 流程）递归深度大，默认 8MiB 栈会
# 栈溢出；abort 绕过 catch_unwind，直接 SIGABRT 掉整个测试进程（基线 2ffe1e99 起即如此）。
# 钉 32MiB 后该用例与 it_web 全量在默认环境全绿。只抬高线程栈虚拟内存上限，RSS 不受影响。
# force：环境里若已有更小的 RUST_MIN_STACK（开发者/CI 变量），必须仍以本值为准，否则回退成红。
RUST_MIN_STACK = { value = "33554432", force = true }

[alias]
test-approval-bridge = "test --locked --lib approval_bridge"
