name: Rust CI

on:
  push:
  pull_request:

env:
  CARGO_TERM_COLOR: always

jobs:
  rust:
    name: fmt, clippy, check, test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: stable
          components: rustfmt, clippy
      - name: Cache cargo artifacts
        uses: Swatinem/rust-cache@v2
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "20"
      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10
      # 前端必须先构建：aria 通过 rust-embed 在编译期嵌入 web/dist，
      # build.rs 会在 web/dist 缺失时硬失败（web/dist 不在版本控制中）。
      - name: Build frontend
        run: pnpm -C web install --frozen-lockfile && pnpm -C web build
      # 证据检索链路的验收用例（tests/it_web/evidence_query）依赖真实
      # `codegraph` CLI 建索引与查询（npm 包 @colbymchenry/codegraph）。
      # 该批用例自 2026-08-17 引入后从未在 CI 跑过（main 上没有该目录），
      # 而 runner 上没有该工具 → 12 个用例一起失败。钉版本安装（与本地一致）；
      # 装不上时用例侧有显式跳过兜底，不会拖垮整个 CI。
      - name: Install codegraph (evidence-query fixtures need the real CLI)
        run: npm install -g @colbymchenry/codegraph@1.6.2

      - name: Check formatting
        run: cargo fmt --check
      - name: Run clippy
        run: cargo clippy --all-targets --all-features --locked -- -D warnings
      - name: Check build
        run: cargo check --locked
      - name: Run tests
        run: cargo test --locked
