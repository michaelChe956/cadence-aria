    reason: 整池清零会静默推翻 REQ-HGC-01（同门 carry-forward、不得每轮重置回默认）与 REQ-CG-02（预留 / 结算 / 退款）；若要整池清零必须显式修改那两条契约，不在本 change 内暗改
