    decided: 2026-11-05
    decision: 后续实施走「方案 a」：marker 通道放行 + 宿主侧授权等价表达
    reason: Kimi 的 CLI 没有「禁用内置写工具」的物理开关（四层核实：argv / ACP wire / config / 官方文档），只能走它已有的受信岗位授权（TrustedDutyGrant）通道；放行后的隔离强度与「Pi 无黑名单的 Coding 会话」同级，不弱于已被接受的现状，真实兜底是 receipt/filesystem auditor（对四家同等生效）
    consequence: 最小改动约 4~5 个文件（见 design.md）
